blurb = Jenkins sets the Content-Security-Policy HTTP response header by default to a fairly safe value. \
  This configuration allows customizing that value, e.g., to make not yet compatible plugins work. \
  The rules below will be applied in the order they are defined here. \
  Note that plugins may contribute to the Content-Security-Policy header, and those are not represented here. \
  The current value of the header can be viewed in the help section for this feature.
